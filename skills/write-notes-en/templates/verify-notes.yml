# Copy this to the host repo's .github/workflows/verify-notes.yml and enable it there.
# Written for the project-level install path .agents/skills/write-notes-en/; if you installed the other language edition, or to .claude/skills/ or a global directory, update the commands below to match.
name: Verify Agent Notes

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify note tree, format, and archive seals
        env:
          # 使用变更前的提交：PR 的目标分支基线，或本次推送前的分支末端。
          # 新分支的全零 before 没有对应提交，显式留空；其他无效引用会使校验失败。
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: |
          npx tsx .agents/skills/write-notes-en/scripts/verify-agent-note-tree.ts
          npx tsx .agents/skills/write-notes-en/scripts/verify-agent-note-format.ts
          npx tsx .agents/skills/write-notes-en/scripts/verify-archived-agent-notes.ts
