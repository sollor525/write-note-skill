# 本仓库的 CI；宿主项目使用 skill 内的工作流模板。
#
# 两个独立任务：
#   gates   — 离线运行门禁回归测试，用例数以测试输出为准。
#   install — 联网调用实际 skills CLI，验证 README 中声明的
#             .agents/skills/ 与 Claude Code .claude/skills/ 安装路径。
name: verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 本仓库尚无归档，暂不配置 AGENT_NOTE_ARCHIVE_BASE_REF。
      # 首次归档后必须指向变更前提交（PR 基线或 github.event.before），
      # 具体配置见 skills/write-notes/templates/verify-notes.yml。
      - name: Verify note tree, format and archive seals
        run: npm run verify-notes

      - name: Gate regression suite (behaviour cases + edition drift guard)
        run: npm run test-gates

      # 这里只测评分器；真实模型评测显式运行，不在 PR 中消耗模型用量。
      - name: Behavior evaluation grader regression suite
        run: npm run test-evals

  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 获取 skills@1.7.1 和 tsx，在临时宿主验证两版技能的多种安装路径。
      - name: Install into a scratch host and exercise the gates there
        run: npm run test-skill-install
